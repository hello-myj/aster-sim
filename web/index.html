<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>aster-sim</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101721;color:#dce6f1;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:16px 22px;border-bottom:1px solid #293648;display:flex;gap:18px;align-items:center}header b{color:#69d3b0;font-size:21px}main{display:flex;gap:24px;padding:24px;align-items:flex-start}.screen{background:#070a0f;padding:12px;border-radius:16px;border:1px solid #344155;box-shadow:0 10px 40px #0006}canvas{display:block;touch-action:none;image-rendering:pixelated;outline:none}aside{width:280px;flex-shrink:0}h3{font-size:14px;color:#8bb4d4;margin:18px 0 8px}button{background:#29394e;color:#eff5fa;border:1px solid #49617a;border-radius:6px;padding:8px;cursor:pointer;margin:0 4px 6px 0}button:hover{background:#3c5270}p{color:#a8b9cc;line-height:1.65}small{color:#8fabc1}pre{background:#09111c;padding:12px;border-radius:6px;height:230px;overflow:auto;white-space:pre-wrap;font-size:12px}label{display:block;margin:8px 0}input{width:70px;background:#182437;color:white;border:1px solid #526880;padding:5px}.status{color:#7adcba}#error{color:#ff9d97}a{color:#8ce0c3}
</style>
<style>@media(max-width:850px){main{flex-direction:column;padding:16px}.screen{max-width:100%}canvas{max-width:100%;height:auto!important}aside{width:100%}header{flex-wrap:wrap}}</style>
<header><b>aster-sim</b><span id="name">正在加载 APP…</span><small>ABI 4.0 · WASM</small></header>
<main><div class="screen"><canvas id="screen" width="240" height="320" tabindex="0" aria-label="APP 屏幕"></canvas></div><aside>
<div id="status" class="status">连接运行时…</div><p id="error"></p>
<h3>运行诊断</h3><pre id="diagnostics" style="height:180px"></pre><h3>运行控制</h3><button id="pause">暂停 / 恢复</button><button id="reset">重新加载</button><button id="stop">结束</button><button id="shot">保存截图</button><button id="sound">启用声音</button><p id="audio-status">点击“启用声音”后播放音频</p>
<h3>输入</h3><p>触屏支持同时操作两指；鼠标点击或拖动模拟一个触点。点击屏幕后可使用键盘，按键按 evdev 编号送入 APP。窗口失焦时释放按键和所有触点。</p>
<h3>模拟六轴 IMU</h3><p>六轴同时采样，缓存10毫秒。坐标固定于传感器，不随屏幕旋转。</p><label>加速度 X / Y / Z（m/s²） <input id="ax" type="number" step="0.1" value="0"><input id="ay" type="number" step="0.1" value="0"><input id="az" type="number" step="0.1" value="9.80665"></label>
<label>角速度 X / Y / Z（rad/s） <input id="gx" type="number" step="0.1" value="0"><input id="gy" type="number" step="0.1" value="0"><input id="gz" type="number" step="0.1" value="0"></label><button id="sensor">应用传感器值</button>
<p id="devices"></p><small>字体、外设时序和性能需在设备上最终验证。</small><h3>APP 日志</h3><pre id="logs"></pre>
</aside></main>
<script src="/audio.js"></script>
<script src="/touch.js"></script>
<script>
const $=id=>document.getElementById(id), canvas=$('screen'), ctx=canvas.getContext('2d');
const ws=new WebSocket(`ws://${location.host}/ws?token=${location.hash.slice(1)}`);let pressed=new Set(), latestFrame=null;
const send=x=>{if(ws.readyState===1)ws.send(JSON.stringify(x))};
const keymap={Escape:1,Digit1:2,Digit2:3,Digit3:4,Digit4:5,Digit5:6,Digit6:7,Digit7:8,Digit8:9,Digit9:10,Digit0:11,Minus:12,Equal:13,Backspace:14,Tab:15,KeyQ:16,KeyW:17,KeyE:18,KeyR:19,KeyT:20,KeyY:21,KeyU:22,KeyI:23,KeyO:24,KeyP:25,BracketLeft:26,BracketRight:27,Enter:28,ControlLeft:29,KeyA:30,KeyS:31,KeyD:32,KeyF:33,KeyG:34,KeyH:35,KeyJ:36,KeyK:37,KeyL:38,Semicolon:39,Quote:40,Backquote:41,ShiftLeft:42,Backslash:43,KeyZ:44,KeyX:45,KeyC:46,KeyV:47,KeyB:48,KeyN:49,KeyM:50,Comma:51,Period:52,Slash:53,ShiftRight:54,AltLeft:56,Space:57,CapsLock:58,Home:102,ArrowUp:103,PageUp:104,ArrowLeft:105,ArrowRight:106,End:107,ArrowDown:108,PageDown:109,Insert:110,Delete:111};
for(let i=1;i<=10;i++)keymap['F'+i]=58+i;keymap.F11=87;keymap.F12=88;
const touchPointers=connectTouchPointers(canvas,send);
canvas.onkeydown=e=>{const code=keymap[e.code];if(code&&!e.repeat){e.preventDefault();pressed.add(code);send({type:'key',code,pressed:1})}};
canvas.onkeyup=e=>{const code=keymap[e.code];if(code){e.preventDefault();pressed.delete(code);send({type:'key',code,pressed:0})}};
function release(){for(const code of pressed)send({type:'key',code,pressed:0});pressed.clear();touchPointers.release()}window.onblur=release;
for(const op of ['pause','reset','stop'])$(op).onclick=()=>{release();send({type:op})};
$('sensor').onclick=()=>send({type:'sensor',accel:['ax','ay','az'].map(id=>Number($(id).value)),gyro:['gx','gy','gz'].map(id=>Number($(id).value))});
$('shot').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='aster-sim.png';a.click()};
const player=new AsterAudioPlayer({send,status:text=>$('audio-status').textContent=text,stats:s=>{ $('audio-status').dataset.musicStarts=s.musicStarts; $('audio-status').dataset.effectPlays=s.effectPlays; },error:text=>$('error').textContent=text});
$('sound').onclick=async()=>{try{await player.enable();$('sound').textContent='声音已启用'}catch(e){$('error').textContent=e.message}};
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ready'){$('name').textContent=m.manifest.name||m.manifest.id;canvas.width=m.width;canvas.height=m.height;canvas.style.width=m.width*m.scale+'px';canvas.style.height=m.height*m.scale+'px';$('status').textContent=`运行中 · ${m.width} × ${m.height}`;$('devices').textContent=`Wi-Fi：${m.wifi?'模拟 station':'关闭'}；相机：${m.features.includes(4)?'图片输入':'不可用'}；录音：${m.features.includes(5)?'PCM 文件输入':'不可用'}`;canvas.focus()}if(m.type==='frame'){latestFrame=m.data;const im=new Image();im.onload=()=>{if(latestFrame===m.data)ctx.drawImage(im,0,0)};im.src='data:image/png;base64,'+m.data}if(m.type==='log'){const lines=$('logs').textContent.split('\n');lines.push(`[${m.ms}ms] ${m.message}`);$('logs').textContent=lines.slice(-150).join('\n');$('logs').scrollTop=$('logs').scrollHeight}if(m.diagnostics)$('diagnostics').textContent=JSON.stringify(m.diagnostics,null,2);if(m.type==='heartbeat')$('status').textContent=(m.paused?'已暂停':'运行中')+' · 帧 '+m.frames;if(m.type==='audio')player.handle(m);if(m.type==='done'){$('status').textContent='APP 已结束 · '+m.code;if(m.error)$('error').textContent=m.error}};
ws.onclose=()=>{$('status').textContent='运行时连接已关闭'};ws.onerror=()=>{$('error').textContent='无法连接模拟器。请使用命令行输出的完整地址。'};
</script></html>
